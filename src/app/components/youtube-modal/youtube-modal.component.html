@if (isOpen()) {
  <div
    class="fixed inset-0 z-[100] flex items-center justify-center bg-ink/95 p-4 sm:p-6 lg:p-20"
    (click)="onClose()"
  >
    <div
      class="relative w-full max-w-5xl overflow-hidden rounded-xl border border-line bg-panel shadow-2xl"
      (click)="$event.stopPropagation()"
    >
      <div class="flex items-center justify-end border-b border-line bg-ink px-4 py-3">
        <button
          (click)="onClose()"
          class="flex items-center gap-2 text-sm font-semibold text-muted transition-colors hover:text-white"
          aria-label="Close modal"
        >
          <span>CLOSE</span>
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <div class="relative w-full bg-black aspect-video">
        @if (safeUrl()) {
          <iframe
            [src]="safeUrl()"
            class="absolute inset-0 h-full w-full"
            frameborder="0"
            allow="autoplay; encrypted-media; picture-in-picture"
            allowfullscreen>
          </iframe>
        }
      </div>
    </div>
  </div>
}
