<header
  class="sticky top-0 z-50 flex items-center justify-between gap-4 border-b border-line bg-[#0d0d0d]/85 bg-gradient-to-r from-white/[0.04] to-white/[0.01] px-6 py-4 sm:px-10 lg:px-20"
>
  <div class="flex items-center gap-2">
    <span class="font-serif text-2xl leading-none text-white sm:text-[28px]">ION VIRLAN</span>
  </div>

  <nav class="hidden items-center gap-8 lg:flex">
    @for (link of links; track link.href) {
      <a
        [href]="link.href"
        class="text-sm transition-colors hover:text-accent"
        [class.text-white]="!link.muted"
        [class.text-muted]="link.muted"
        >{{ link.label }}</a
      >
    }
  </nav>

  <button
    type="button"
    class="flex h-9 w-9 items-center justify-center rounded-md border border-line text-white lg:hidden"
    (click)="toggleMenu()"
    aria-label="Toggle menu"
  >
    @if (menuOpen) {
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 6 6 18M6 6l12 12" stroke-linecap="round" />
      </svg>
    } @else {
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 6h18M3 12h18M3 18h18" stroke-linecap="round" />
      </svg>
    }
  </button>

  @if (menuOpen) {
    <nav
      class="absolute left-0 top-full flex w-full flex-col gap-4 border-b border-line bg-[#0d0d0d] px-6 py-6 lg:hidden"
    >
      @for (link of links; track link.href) {
        <a
          [href]="link.href"
          class="text-sm transition-colors hover:text-accent"
          [class.text-white]="!link.muted"
          [class.text-muted]="link.muted"
          (click)="closeMenu()"
          >{{ link.label }}</a
        >
      }
    </nav>
  }
</header>
