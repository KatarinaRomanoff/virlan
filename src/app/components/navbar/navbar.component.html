<nav class="fixed top-0 z-50 w-full bg-ink/60 backdrop-blur-sm border-b border-line">
    <div class="flex items-center justify-between px-6 py-4 sm:px-10 lg:px-20" >
      <ng-container *transloco="let t">
      <a href="#" class="text-xl font-bold text-white">
        {{ t('navbar.band') }}
      </a>
      </ng-container>

      <!-- Mobile menu button -->
      <button
        (click)="toggleMenu()"
        class="lg:hidden flex flex-col gap-1.5 p-2"
        aria-label="Toggle menu"
      >
        <span class="block w-6 h-0.5 bg-white transition-all duration-300" [class.rotate-45]="menuOpen" [class.translate-y-2]="menuOpen"></span>
        <span class="block w-6 h-0.5 bg-white transition-all duration-300" [class.opacity-0]="menuOpen"></span>
        <span class="block w-6 h-0.5 bg-white transition-all duration-300" [class.-rotate-45]="menuOpen" [class.-translate-y-2]="menuOpen"></span>
      </button>

      <!-- Desktop menu -->
      <div class="hidden lg:flex items-center gap-6">
        <ng-container *transloco="let t">
        @for (link of links; track link.key) {
          <a
            [href]="link.href"
            (click)="closeMenu()"
            class="text-sm font-semibold hover:text-accent transition-colors"
            [class.text-accent]="link.active"
            [class.text-white]="!link.active"
          >
            {{ t('navbar.' + link.key) }}
          </a>
        }
        </ng-container>
        <app-language-switcher></app-language-switcher>
        <span class="h-4 w-px bg-line"></span>
        <div class="flex items-center gap-4">
          <a
            href="https://www.youtube.com/@ionvirlan9657"
            target="_blank"
            rel="noopener"
            aria-label="YouTube"
            class="text-muted transition-colors hover:text-accent"
          >
            <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24" role="img">
              <title>YouTube</title>
              <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z" />
            </svg>
          </a>
          <a
            href="https://tidal.com/artist/50983262"
            target="_blank"
            rel="noopener"
            aria-label="Tidal"
            class="text-muted transition-colors hover:text-accent"
          >
            <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24" role="img">
              <title>TIDAL</title>
              <path d="M12.012 3.992L8.008 7.996 4.004 3.992 0 7.996 4.004 12l4.004-4.004L12.012 12l-4.004 4.004 4.004 4.004 4.004-4.004L12.012 12l4.004-4.004-4.004-4.004zM16.042 7.996l3.979-3.979L24 7.996l-3.979 3.979z" />
            </svg>
          </a>
        </div>
      </div>
    </div>

    <!-- Mobile menu -->
    @if (menuOpen) {
      <div class="lg:hidden px-6 py-4 bg-ink/60 backdrop-blur-sm border-t border-line">
        <ng-container *transloco="let t">
        @for (link of links; track link.key) {
          <a
            [href]="link.href"
            (click)="setActive(link)"
            class="block py-3 text-sm font-semibold hover:text-accent transition-colors"
            [class.text-accent]="link.active"
            [class.text-white]="!link.active"
          >
            {{ t('navbar.' + link.key) }}
          </a>
        }
        </ng-container>
        <div class="flex items-center gap-2 pt-4 border-t border-line">
          <app-language-switcher></app-language-switcher>
          <span class="ml-auto flex items-center gap-4">
            <a
              href="https://www.youtube.com/@ionvirlan9657"
              target="_blank"
              rel="noopener"
              aria-label="YouTube"
              class="text-muted transition-colors hover:text-accent"
            >
              <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24" role="img">
                <title>YouTube</title>
                <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z" />
              </svg>
            </a>
            <a
              href="https://tidal.com/artist/50983262"
              target="_blank"
              rel="noopener"
              aria-label="Tidal"
              class="text-muted transition-colors hover:text-accent"
            >
              <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24" role="img">
                <title>TIDAL</title>
                <path d="M12.012 3.992L8.008 7.996 4.004 3.992 0 7.996 4.004 12l4.004-4.004L12.012 12l-4.004 4.004 4.004 4.004 4.004-4.004L12.012 12l4.004-4.004-4.004-4.004zM16.042 7.996l3.979-3.979L24 7.996l-3.979 3.979z" />
              </svg>
            </a>
          </span>
        </div>
      </div>
    }
</nav>
