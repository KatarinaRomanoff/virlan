<footer class="border-t border-line bg-[#0d0d0d]/90 px-6 py-10 sm:px-10 lg:px-20">
  <ng-container *transloco="let t">
    <div class="flex flex-col items-start justify-between gap-6 sm:flex-row sm:items-center">
      <div class="flex flex-col items-start gap-2">
        <span class="font-serif text-2xl text-white sm:text-[28px]">{{ t('footer.title') }}</span>
        <span class="text-xs text-muted">{{ t('footer.subtitle') }}</span>
      </div>
      <div class="flex flex-wrap items-center gap-4 sm:gap-6">
        <span class="text-sm text-muted">{{ t('footer.location') }}</span>
        <a href="mailto:virionut&#64;gmail.com" class="text-sm text-accent">{{ t('footer.email') }}</a>
        <div class="flex items-center gap-4">
          <a
            href="https://www.youtube.com/@ionvirlan9657"
            target="_blank"
            rel="noopener"
            aria-label="YouTube"
            class="text-muted transition-colors hover:text-accent"
          >
            <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24" role="img">
              <title>YouTube</title>
              <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z" />
            </svg>
          </a>
          <a
            href="https://tidal.com/artist/50983262"
            target="_blank"
            rel="noopener"
            aria-label="Tidal"
            class="text-muted transition-colors hover:text-accent"
          >
            <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24" role="img">
              <title>TIDAL</title>
              <path d="M12.012 3.992L8.008 7.996 4.004 3.992 0 7.996 4.004 12l4.004-4.004L12.012 12l-4.004 4.004 4.004 4.004 4.004-4.004L12.012 12l4.004-4.004-4.004-4.004zM16.042 7.996l3.979-3.979L24 7.996l-3.979 3.979z" />

      </div>
    </div>
  </ng-container>
</footer>
