<footer class="border-t border-line bg-[#0d0d0d]/90 px-6 py-10 sm:px-10 lg:px-20">
  <ng-container *transloco="let t">
    <div class="flex flex-col items-start justify-between gap-6 sm:flex-row sm:items-center">
      <div class="flex flex-col items-start gap-2">
        <span class="font-serif text-2xl text-white sm:text-[28px]">{{ t('footer.title') }}</span>
        <span class="text-xs text-muted">{{ t('footer.subtitle') }}</span>
      </div>
      <div class="flex flex-wrap items-center gap-4 sm:gap-6">
        <span class="text-sm text-muted">{{ t('footer.location') }}</span>
        <a href="mailto:virionut&#64;gmail.com" class="text-sm text-accent">{{ t('footer.email') }}</a>
      </div>
    </div>
  </ng-container>
</footer>
